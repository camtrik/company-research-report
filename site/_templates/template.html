<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- include: head.html -->
  <title data-region="title">TICKER — Company Name</title>
  <link rel="stylesheet" href="{{SITE_BASE_PATH}}/assets/css/company.css">
  <meta data-region="meta"
        data-ticker="TICKER"
        data-name="中文名"
        data-name-en="English Name"
        data-market="US"
        data-sector="Sector"
        data-view="Watch"
        data-tags=""
        data-last-updated="YYYY-MM-DD">
</head>
<body>
  <!-- include: header.html -->

  <main class="company-page">
    <!-- ============ Header ============ -->
    <header class="company-header">
      <div class="section__inner">
        <div class="eyebrow eyebrow--muted company-header__eyebrow">
          <span data-bind="market"></span>
          <span class="sep">·</span>
          <span data-bind="sector"></span>
          <span class="sep">·</span>
          <span data-bind="last-updated"></span>
        </div>
        <h1 class="company-header__title" data-bind="name"></h1>
        <p class="company-header__sub">
          <span class="ticker" data-bind="ticker"></span>
          <span class="sep">·</span>
          <span data-bind="name-en"></span>
        </p>
        <div class="company-header__meta" data-bind="tags-row"></div>
      </div>
    </header>

    <!-- ↓ 关键数据快照（sync skill 维护）↓ -->
    <section class="section section--no-pad-top">
      <div class="section__inner">
        <div class="market-data" data-region="snapshot">
          <div class="market-data__tile">
            <span class="market-data__label">股价</span>
            <span class="market-data__value">—</span>
          </div>
          <div class="market-data__tile">
            <span class="market-data__label">市值</span>
            <span class="market-data__value">—</span>
          </div>
          <div class="market-data__tile">
            <span class="market-data__label">Forward P/E</span>
            <span class="market-data__value">—</span>
          </div>
          <div class="market-data__tile">
            <span class="market-data__label">P/B</span>
            <span class="market-data__value">—</span>
          </div>
          <div class="market-data__tile">
            <span class="market-data__label">Revenue Growth</span>
            <span class="market-data__value">—</span>
          </div>
          <div class="market-data__tile">
            <span class="market-data__label">Operating Margin</span>
            <span class="market-data__value">—</span>
          </div>
          <div class="market-data__tile">
            <span class="market-data__label">Net Margin</span>
            <span class="market-data__value">—</span>
          </div>
          <div class="market-data__tile market-data__tile--sm">
            <span class="market-data__label">52 周区间</span>
            <span class="market-data__value">—</span>
          </div>
          <div class="market-data__tile market-data__tile--accent">
            <span class="market-data__label">分析师目标价</span>
            <span class="market-data__value">—</span>
          </div>
          <div class="market-data__tile market-data__tile--sm">
            <span class="market-data__label">分析截至</span>
            <span class="market-data__value">—</span>
          </div>
        </div>
        <p class="eyebrow eyebrow--muted" style="margin-top:var(--s-2);text-align:right;">数据截至 —</p>
      </div>
    </section>

    <section class="section section--no-pad-top">
      <div class="section__inner">
        <div class="charts" data-region="charts">
          <figure class="chart-row">
            <figcaption class="chart-row__caption">
              <span class="chart-row__title">10 年股价走势</span>
              <span class="chart-row__meta">price · 月度</span>
            </figcaption>
            <div class="chart-row__canvas-wrap">
              <canvas data-chart="price-10y"></canvas>
            </div>
          </figure>
          <figure class="chart-row">
            <figcaption class="chart-row__caption">
              <span class="chart-row__title">10 年 PER / PBR 走势</span>
              <span class="chart-row__meta">年度 · 双 Y 轴</span>
            </figcaption>
            <div class="chart-row__canvas-wrap">
              <canvas data-chart="per-pbr-10y"></canvas>
            </div>
          </figure>
        </div>

        <!-- PER / PBR 历史数据表（sync skill 维护；位于 PER/PBR 折线图下方） -->
        <div class="per-pbr-history"></div>
        <p class="eyebrow eyebrow--muted" style="margin-top:var(--s-2);text-align:right;">图表 / 表格数据截至 <span data-bind="per-pbr-updated">—</span></p>
      </div>
    </section>
    <!-- ↑ 关键数据 / 图表区结束 ↑ -->

    <!-- ↓ 内容区（sync skill 维护，AI 可自由生成 HTML 片段） ↓ -->
    <!-- 公司概要 — section-plain，作为第一个内容 section -->
    <section class="section section--top-border" data-region="company-overview">
      <div class="section__inner">
        <div class="section-plain__head"><h2>公司概要</h2></div>
        <div class="section-plain__body"></div>
      </div>
    </section>

    <!-- 核心结论 — section-plain -->
    <section class="section" data-region="thesis">
      <div class="section__inner">
        <div class="section-plain__head"><h2>核心结论</h2></div>
        <div class="section-plain__body"></div>
      </div>
    </section>

    <!-- 业务模式 — 浅灰底 + feature-card 仅含核心，扩展内容（如分部表）放在 section-plain__body -->
    <section class="section section--tinted" data-region="business-model">
      <div class="section__inner">
        <div class="feature-card">
          <h2>业务模式</h2>
        </div>
        <div class="section-plain__body"></div>
      </div>
    </section>

    <!-- 财务表现 — section-plain（含宽表格） -->
    <section class="section" data-region="financials">
      <div class="section__inner">
        <div class="section-plain__head"><h2>财务表现</h2></div>
        <div class="section-plain__body"></div>
      </div>
    </section>

    <!-- 护城河 — 浅灰底 + feature-card 仅含核心，对比表放在 section-plain__body -->
    <section class="section section--tinted" data-region="moat">
      <div class="section__inner">
        <div class="feature-card">
          <h2>护城河</h2>
        </div>
        <div class="section-plain__body"></div>
      </div>
    </section>

    <!-- 催化剂 — section-plain + 短期/中期两张白卡 -->
    <section class="section" data-region="catalysts">
      <div class="section__inner">
        <div class="section-plain__head"><h2>催化剂 / 关注点</h2></div>
        <div class="section-plain__body"></div>
      </div>
    </section>

    <!-- 估值 — section-plain（含宽表格） -->
    <section class="section" data-region="valuation">
      <div class="section__inner">
        <div class="section-plain__head"><h2>估值</h2></div>
        <div class="section-plain__body"></div>
      </div>
    </section>

    <!-- 风险 — section-plain + risk-grid 2 列卡片网格 -->
    <section class="section" data-region="risks">
      <div class="section__inner">
        <div class="section-plain__head"><h2>主要风险</h2></div>
        <div class="section-plain__body"></div>
      </div>
    </section>

    <!-- 待验证问题 — section-plain + tinted Q-badge 卡片 -->
    <section class="section" data-region="open-questions">
      <div class="section__inner">
        <div class="section-plain__head"><h2>待验证问题</h2></div>
        <div class="section-plain__body"></div>
      </div>
    </section>
    <!-- ↑ 内容区结束 ↑ -->

    <!-- 变更日志入口（固定结构，AI 不动） -->
    <div class="changelog-cta" data-region="changelog-link">
      <a href="changelog.html">查看更新记录 →</a>
    </div>
  </main>

  <!-- include: footer.html -->
  <script src="{{SITE_BASE_PATH}}/assets/vendor/chart.umd.min.js"></script>
  <script src="{{SITE_BASE_PATH}}/assets/js/charts.js"></script>
  <script>loadCompanyData('TICKER');</script>
</body>
</html>
