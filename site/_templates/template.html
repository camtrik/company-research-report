<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- include: head.html -->
  <title data-region="title">TICKER — Company Name</title>
  <link rel="stylesheet" href="{{SITE_BASE_PATH}}/assets/css/company.css">
  <meta data-region="meta"
        data-ticker="TICKER"
        data-name="中文名"
        data-name-en="English Name"
        data-market="US"
        data-sector="Sector"
        data-view="Watch"
        data-tags=""
        data-last-updated="YYYY-MM-DD">
</head>
<body>
  <!-- include: header.html -->

  <main class="company-page">
    <!-- ============ Header ============ -->
    <header class="company-header">
      <div class="section__inner">
        <div class="company-header__row">
          <div class="company-header__lead">
            <div class="eyebrow eyebrow--muted company-header__eyebrow">
              <span data-bind="market"></span>
              <span class="sep">·</span>
              <span data-bind="sector"></span>
              <span class="sep">·</span>
              <span data-bind="last-updated"></span>
            </div>
            <h1 class="company-header__title" data-bind="name"></h1>
            <p class="company-header__name-en" data-bind="name-en"></p>
            <div class="company-header__sub">
              <span class="company-header__ticker" data-bind="ticker"></span>
              <span class="pill pill--view"><span class="material-symbols-outlined" style="font-size:14px">trending_up</span><span data-bind="view"></span></span>
            </div>
          </div>
          <div class="company-header__side">
            <div class="eyebrow eyebrow--muted">数据更新</div>
            <div class="company-header__side-value" data-bind="updated-at">—</div>
          </div>
        </div>
        <div class="company-header__meta" data-bind="tags-row"></div>
      </div>
    </header>

    <!-- ============ Market data (runtime; AI 永远不动) ============ -->
    <section class="section section--no-pad-top">
      <div class="section__inner">
        <div class="market-data" data-region="market-data">
          <div class="market-data__tile">
            <span class="market-data__label">股价</span>
            <span class="market-data__value" data-bind="price">—</span>
          </div>
          <div class="market-data__tile">
            <span class="market-data__label">市值</span>
            <span class="market-data__value" data-bind="market-cap">—</span>
          </div>
          <div class="market-data__tile">
            <span class="market-data__label">Forward P/E</span>
            <span class="market-data__value" data-bind="pe-forward">—</span>
          </div>
          <div class="market-data__tile">
            <span class="market-data__label">P/B</span>
            <span class="market-data__value" data-bind="pb">—</span>
          </div>
          <div class="market-data__tile">
            <span class="market-data__label">Revenue Growth</span>
            <span class="market-data__value" data-bind="revenue-growth-ttm">—</span>
          </div>
          <div class="market-data__tile">
            <span class="market-data__label">Operating Margin</span>
            <span class="market-data__value" data-bind="operating-margin">—</span>
          </div>
          <div class="market-data__tile">
            <span class="market-data__label">Net Margin</span>
            <span class="market-data__value" data-bind="net-margin">—</span>
          </div>
          <div class="market-data__tile market-data__tile--sm">
            <span class="market-data__label">52 周区间</span>
            <span class="market-data__value" data-bind="week52-range">—</span>
          </div>
          <div class="market-data__tile market-data__tile--accent">
            <span class="market-data__label">分析师目标价</span>
            <span class="market-data__value" data-bind="analyst-target">—</span>
          </div>
          <div class="market-data__tile market-data__tile--sm">
            <span class="market-data__label">Updated At</span>
            <span class="market-data__value" data-bind="updated-at">—</span>
            <span class="market-data__mock-badge" data-bind-mock-badge hidden>MOCK</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ Charts (runtime; AI 永远不动) ============ -->
    <section class="section section--no-pad-top" data-region="charts">
      <div class="section__inner charts">
        <figure class="chart-row">
          <figcaption class="chart-row__caption">
            <span class="chart-row__title">10 年股价走势</span>
            <span class="chart-row__meta">price · 月度</span>
          </figcaption>
          <div class="chart-row__canvas-wrap">
            <canvas data-chart="price-10y"></canvas>
          </div>
        </figure>
        <figure class="chart-row">
          <figcaption class="chart-row__caption">
            <span class="chart-row__title">10 年 PER / PBR 走势</span>
            <span class="chart-row__meta">年度 · 双 Y 轴</span>
          </figcaption>
          <div class="chart-row__canvas-wrap">
            <canvas data-chart="per-pbr-10y"></canvas>
          </div>
        </figure>
      </div>
    </section>

    <!-- ============ 内容区（sync skill 维护，AI 可自由生成 HTML 片段） ============ -->
    <section class="section section--top-border" data-region="thesis">
      <div class="section__inner section-2col">
        <div class="section-2col__head"><h2>核心结论</h2></div>
        <div class="section-2col__body"></div>
      </div>
    </section>

    <section class="section" data-region="company-overview">
      <div class="section__inner section-2col">
        <div class="section-2col__head"><h2>公司概要</h2></div>
        <div class="section-2col__body"></div>
      </div>
    </section>

    <section class="section section--tinted" data-region="business-model">
      <div class="section__inner">
        <div class="feature-card">
          <div class="feature-card__icon"><span class="material-symbols-outlined">account_tree</span></div>
          <h2>业务模式</h2>
        </div>
      </div>
    </section>

    <section class="section" data-region="financials">
      <div class="section__inner">
        <div class="section-plain__head"><h2>财务表现</h2></div>
        <div class="section-plain__body"></div>
      </div>
    </section>

    <section class="section section--tinted" data-region="moat">
      <div class="section__inner">
        <div class="feature-card">
          <div class="feature-card__icon"><span class="material-symbols-outlined">security</span></div>
          <h2>竞争与护城河</h2>
        </div>
      </div>
    </section>

    <section class="section" data-region="catalysts">
      <div class="section__inner section-2col">
        <div class="section-2col__head"><h2>催化剂 / 关注点</h2></div>
        <div class="section-2col__body"></div>
      </div>
    </section>

    <section class="section" data-region="valuation">
      <div class="section__inner">
        <div class="section-plain__head"><h2>估值</h2></div>
        <div class="section-plain__body"></div>
      </div>
    </section>

    <section class="section" data-region="risks">
      <div class="section__inner section-2col">
        <div class="section-2col__head"><h2>主要风险</h2></div>
        <div class="section-2col__body"></div>
      </div>
    </section>

    <section class="section" data-region="open-questions">
      <div class="section__inner section-2col">
        <div class="section-2col__head"><h2>待验证问题</h2></div>
        <div class="section-2col__body"></div>
      </div>
    </section>

    <!-- 变更日志入口（固定结构，AI 不动） -->
    <div class="changelog-cta" data-region="changelog-link">
      <a href="changelog.html">查看更新记录 →</a>
    </div>
  </main>

  <!-- include: footer.html -->
  <script src="{{SITE_BASE_PATH}}/assets/vendor/chart.umd.min.js"></script>
  <script src="{{SITE_BASE_PATH}}/assets/js/charts.js"></script>
  <script>loadCompanyData('TICKER');</script>
</body>
</html>
